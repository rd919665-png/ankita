<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a201b"/>
      <stop offset="50%" stop-color="#1c1613"/>
      <stop offset="100%" stop-color="#120e0c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="40%" stop-color="#d4a34b"/>
      <stop offset="70%" stop-color="#b8832a"/>
      <stop offset="100%" stop-color="#8a5a16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.4" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="202" fill="none" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#d4a34b" stroke-width="1" opacity="0.6"/>

  <!-- Top Crown / Star Sparkle -->
  <path d="M 256 100 L 261 118 L 279 123 L 261 128 L 256 146 L 251 128 L 233 123 L 251 118 Z" fill="url(#goldGrad)"/>

  <!-- Monogram A -->
  <text x="256" y="325" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="190" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">A</text>

  <!-- Brand Arc/Subtext -->
  <text x="256" y="375" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="600" fill="#f3e5d3" text-anchor="middle" letter-spacing="7" opacity="0.95">ANKITA</text>
  <text x="256" y="405" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="500" fill="#d4a34b" text-anchor="middle" letter-spacing="5" opacity="0.85">MAKEUP ARTIST</text>

  <!-- Bottom Accent Leaf / Lotus Dots -->
  <circle cx="216" cy="428" r="2.5" fill="#d4a34b" opacity="0.7"/>
  <circle cx="256" cy="428" r="4" fill="url(#goldGrad)"/>
  <circle cx="296" cy="428" r="2.5" fill="#d4a34b" opacity="0.7"/>
</svg>
